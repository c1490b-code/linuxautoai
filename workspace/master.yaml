# master.yaml - extended examples including pytorch and pygpt-backed tasks

tasks:
  - id: summarize-markdown
    trigger: on_change
    watch_path: scales/**/*.md
    model: auto
    prompt_template: |
      Summarize the following markdown file and produce an action list and short TODOs:
      {{file_contents}}
    output_path: results/summary_{{watch_basename}}_{{prompt_hash}}.txt

  - id: gen-tests-periodic
    trigger: periodic
    interval_seconds: 3600
    watch_path: scales/**/*.py
    model: ["local", "openai"]
    llama_model: /path/to/ggml-small.bin
    prompt_template: |
      Create pytest-compatible unit tests for the following Python file:
      {{file_contents}}
    output_path: results/tests_{{watch_basename}}_{{prompt_hash}}.py

  - id: local-pytorch-summarize
    trigger: on_change
    watch_path: scales/**/*.md
    model: ["local", "pytorch", "openai"]
    prompt_template: |
      Use a local transformers model to summarize this file. Return a short summary and 3 next steps.
      {{file_contents}}
    output_path: results/pytorch_summary_{{watch_basename}}_{{prompt_hash}}.txt

  - id: pygpt-snippet
    trigger: on_change
    watch_path: scales/snippets/**/*.txt
    model: ["pygpt", "openai"]
    prompt_template: |
      Provide a cleaned-up, style-unified version of this snippet. Normalize to concise language.
      {{file_contents}}
    output_path: results/pygpt_snippet_{{watch_basename}}_{{prompt_hash}}.txt
